services:
  api:
    build: .
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost:5173
      # GOOGLE_API_KEY: your_key_here
    volumes:
      - ./plans.json:/app/plans.json
      - ./users.json:/app/users.json

